# Boot a throwaway copy of the pull request's stack and wait for every health
# check. Renovate merges its own pull requests only when this passes.
on: pull_request

jobs:
  test:
    runs-on: docker
    container: docker:29.10.0-cli
    steps:
      - run: git clone -q --depth 1 -b ${{ forgejo.head_ref }} http://x:${{ forgejo.token }}@forgejo:3000/${{ forgejo.repository }} .
      - run: docker compose -p test -f compose.yaml -f compose.test.yaml up -d --wait
      - if: failure()
        run: docker compose -p test logs --tail 50
      - if: always()
        run: docker compose -p test down -v
