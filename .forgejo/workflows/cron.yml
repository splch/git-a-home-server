# Nightly housekeeping. Add your own scheduled jobs here.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: docker
    container: docker:29.10.0-cli
    env:
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
    steps:
      - run: git clone -q --depth 1 http://x:${{ forgejo.token }}@forgejo:3000/${{ forgejo.repository }} .
      # Paused services cannot write, so every file is captured at one instant.
      # The image is pulled first so that nothing downloads during the pause.
      # The excluded files are Docker's own bookkeeping.
      - run: |
          docker compose pull -q --policy missing restic
          trap 'docker compose unpause' EXIT
          docker compose pause
          docker compose run --rm restic backup -q -e metadata.db -e backingFsBlockDev /var/lib/docker/volumes
      - run: docker compose run --rm restic forget --prune --keep-daily 7 --keep-weekly 4 --keep-monthly 12
      - run: docker compose run --rm restic check

  # Remove unused images, containers, and build cache older than a week.
  prune:
    runs-on: docker
    container: docker:29.10.0-cli
    steps:
      - run: docker system prune -af --filter until=168h
